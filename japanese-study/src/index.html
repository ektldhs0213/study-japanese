<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>일본어 문장 카드</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css?v=202607250252" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">개인 일본어 학습 PWA</p>
        <h1>일본어 문장 카드</h1>
        <p class="source-date">소스날짜 : 07월25일 02시 52분</p>
      </div>
      <button id="installBtn" class="icon-button hidden" type="button" title="앱 설치">＋</button>
    </header>

    <main class="app-shell">
      <section class="today-card" aria-label="오늘의 문장">
        <div id="todaySentence" class="sentence-display">
          <p class="meaning">단어를 추가하면 오늘의 문장이 표시됩니다.</p>
          <p class="jp hidden">예: かんこくじん</p>
          <p class="reading hidden">예: 캉코쿠진</p>
        </div>
        <div class="button-row">
          <button id="revealTodayBtn" type="button">문장 보기</button>
          <button id="speakTodayBtn" type="button">발음 듣기</button>
          <button id="changeTodayBtn" type="button">랜덤 변경</button>
        </div>
      </section>

      <nav class="tabs" aria-label="학습 메뉴">
        <button class="tab active" data-tab="words" type="button">단어 입력</button>
        <button class="tab" data-tab="wordStudy" type="button">단어 암기</button>
        <button class="tab" data-tab="kana" type="button">가나</button>
        <button class="tab" data-tab="sentences" type="button">문장</button>
        <button class="tab" data-tab="manage" type="button">관리</button>
      </nav>

      <section id="wordsPanel" class="panel active" aria-label="단어장">
        <div class="section-heading">
          <div>
            <h2>단어장</h2>
          </div>
        </div>

        <div class="quick-add">
          <label>
            일괄 입력일
            <input id="bulkDateInput" type="date" />
          </label>
          <textarea id="bulkInput" rows="9" aria-label="여러 단어 입력" placeholder="わたし/와타시/나, 저/pronoun/person,human&#10;みせ/미세/가게/noun/place,facility&#10;おいしい/오이시이/맛있다/i_adjective/taste,food"></textarea>
          <button id="bulkAddBtn" type="button">여러 단어 저장</button>
        </div>
      </section>

      <section id="wordStudyPanel" class="panel" aria-label="단어 암기">
        <div class="section-heading">
          <div>
            <h2>단어 암기</h2>
          </div>
          <span id="wordStudyPosition" class="count-badge">0 / 0</span>
        </div>

        <article class="kana-card word-study-card">
          <p id="wordStudyJapanese" class="kana-character">単語</p>
          <p id="wordStudyMeaning" class="kana-romaji hidden">뜻</p>
          <p id="wordStudyReading" class="kana-korean hidden">발음</p>
        </article>

        <div class="word-study-filter" aria-label="단어 입력 날짜 필터">
          <div class="segmented-control filter-mode-control">
            <button id="wordStudyAllFilterBtn" class="active" type="button">전체</button>
            <button id="wordStudyDatesFilterBtn" type="button">날짜 선택</button>
            <button id="wordStudyRangeFilterBtn" type="button">기간</button>
          </div>

          <div id="wordStudyDateOptions" class="date-filter-options hidden"></div>
          <button
            id="wordStudyToggleDatesBtn"
            class="date-toggle-button hidden"
            type="button"
            aria-label="이전 날짜 펼치기"
            aria-expanded="false"
            title="이전 날짜 펼치기"
          ></button>

          <div id="wordStudyRangeFields" class="date-range-fields hidden">
            <label>
              시작일
              <input id="wordStudyStartDate" type="date" />
            </label>
            <label>
              종료일
              <input id="wordStudyEndDate" type="date" />
            </label>
          </div>

          <p id="wordStudyDataStatus" class="connection-status">Supabase 단어를 불러오는 중입니다.</p>
        </div>

        <div class="button-grid word-study-actions">
          <button id="prevWordStudyBtn" type="button">이전</button>
          <button id="nextWordStudyBtn" type="button">다음</button>
          <button id="randomWordStudyBtn" type="button">랜덤</button>
          <button id="toggleWordStudyAnswerBtn" type="button">답안 보기</button>
          <button id="speakWordStudyBtn" type="button">발음 듣기</button>
        </div>

        <section class="word-study-list-section" aria-labelledby="wordStudyListTitle">
          <div class="section-heading compact-heading">
            <h3 id="wordStudyListTitle">학습 단어 목록</h3>
            <span id="wordStudyListCount" class="count-badge">0개</span>
          </div>
          <div id="wordStudyList" class="word-study-list"></div>
        </section>
      </section>

      <section id="kanaPanel" class="panel" aria-label="히라가나와 가타카나">
        <div class="section-heading">
          <div>
            <h2>히라가나 · 가타카나</h2>
          </div>
          <span id="kanaProgress" class="count-badge">0 / 0</span>
        </div>

        <div class="segmented-control" role="group" aria-label="문자 종류 선택">
          <button id="hiraganaModeBtn" class="active" type="button">히라가나</button>
          <button id="katakanaModeBtn" type="button">가타카나</button>
        </div>

        <article class="kana-card">
          <p id="kanaCharacter" class="kana-character">あ</p>
          <p id="kanaRomaji" class="kana-romaji hidden">a</p>
          <p id="kanaKorean" class="kana-korean hidden">아</p>
        </article>

        <div class="button-grid">
          <button id="prevKanaBtn" type="button">이전</button>
          <button id="nextKanaBtn" type="button">다음</button>
          <button id="randomKanaBtn" type="button">랜덤</button>
          <button id="toggleKanaAnswerBtn" type="button">답 보기</button>
          <button id="speakKanaBtn" type="button">발음 듣기</button>
          <button id="shuffleKanaBtn" type="button">표 섞기</button>
        </div>

        <div id="kanaGrid" class="kana-grid" aria-label="가나 표"></div>
      </section>

      <section id="sentencesPanel" class="panel" aria-labelledby="sentencesTitle">
        <div class="section-heading">
          <div>
            <h2 id="sentencesTitle">문장 학습</h2>
          </div>
          <div class="heading-actions">
            <span id="cardPosition" class="count-badge">0 / 0</span>
            <span id="sentenceCount" class="count-badge">0개</span>
          </div>
        </div>

        <article class="study-card">
          <div id="cardSentence" class="sentence-display">
            <p class="jp">문장이 없습니다.</p>
            <p class="reading">단어를 먼저 입력해 주세요.</p>
            <p class="meaning">생성된 문장이 여기에 표시됩니다.</p>
          </div>
        </article>

        <div class="button-grid sentence-card-actions">
          <button id="prevBtn" type="button">이전</button>
          <button id="nextBtn" type="button">다음</button>
          <button id="randomBtn" type="button">랜덤</button>
          <button id="speakCardBtn" type="button">카드 읽기</button>
          <button id="toggleReadingBtn" type="button">발음 보기</button>
          <button id="toggleMeaningBtn" type="button">뜻 보기</button>
          <button id="generateAiBtn" type="button">문장 생성 (with AI)</button>
        </div>

        <div class="range-label">
          <span>읽기 속도</span>
          <input id="rateInput" type="range" min="0.5" max="1.4" step="0.1" value="0.9" />
          <span id="rateValue">0.9x</span>
          <button id="toggleSentenceOptionsBtn" class="sentence-options-toggle" type="button"
            aria-label="문장 설정 펼치기" aria-expanded="false" title="문장 설정 펼치기"></button>
        </div>

        <div id="sentenceStyleOptions" class="style-options hidden">
          <label>
            일본어 문체
            <select id="jpStyleSelect">
              <option value="polite" selected>존댓말</option>
              <option value="plain">반말</option>
            </select>
          </label>
          <label>
            한국어 문체
            <select id="krStyleSelect">
              <option value="polite" selected>존댓말</option>
              <option value="plain">반말</option>
            </select>
          </label>
          <label>
            번역 방식
            <select id="translationModeSelect">
              <option value="natural" selected>자연번역</option>
              <option value="literal">직역</option>
            </select>
          </label>
        </div>

        <p id="aiStatus" class="helper-text" role="status"></p>
        <div id="sentenceList" class="sentence-list"></div>
      </section>

      <section id="managePanel" class="panel" aria-label="관리">
        <div class="management-section api-key-box">
          <div>
            <h3>프로젝트 연결 확인</h3>
          </div>
          <input id="geminiApiKeyInput" type="text" aria-label="Supabase 프로젝트 주소" placeholder="Cloudflare 빌드 환경변수에서 설정" autocomplete="off" readonly />
          <div class="button-row supabase-actions">
            <button id="testAiConnectionBtn" class="ghost-button" type="button">AI 연결 확인</button>
            <button id="clearGeminiKeyBtn" class="ghost-button" type="button">새로고침</button>
            <button id="testGeminiKeyBtn" class="ghost-button" type="button">DB 연결 확인</button>
            <button id="saveGeminiKeyBtn" class="ghost-button" type="button">DB 설정 확인</button>
            <button id="clearBtn" class="ghost-button" type="button">기기 캐시 초기화</button>
          </div>
          <p id="geminiKeyStatus" class="connection-status hidden"></p>
          <p id="aiConnectionStatus" class="connection-status hidden"></p>
        </div>

        <div class="management-section">
          <div>
            <h3>백업과 복원</h3>
          </div>
          <div class="manage-actions">
            <button id="exportBtn" type="button">JSON 내보내기</button>
            <label class="file-button">
              JSON 가져오기
              <input id="importInput" type="file" accept="application/json" />
            </label>
          </div>
          <textarea id="exportOutput" rows="8" readonly placeholder="내보낸 JSON이 여기에 표시됩니다."></textarea>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="lib/supabase.js?v=202607250252"></script>
    <script src="services/japaneseService.js?v=202607250252"></script>
    <script src="app.js?v=202607250252"></script>
  </body>
</html>
